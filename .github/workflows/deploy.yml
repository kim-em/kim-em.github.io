name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per ref, not one global "pages" group: a workflow_dispatch test run on a
# branch used to cancel an in-flight master deploy, and be cancelled by one.
# Only master reaches the deploy job, so master runs still serialise.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # examples/examples.json is the single source of truth for which example
  # projects exist, which modules they contribute, and what each needs to
  # build. The site build reads it too (Site/Examples.lean).
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.read.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          projects=$(jq -ce 'length > 0' examples/examples.json >/dev/null && jq -c . examples/examples.json)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  # One job per example project. They have no dependencies on one another, so
  # what used to be ~34 minutes of sequential Lean builds is now the slowest
  # single project. Each uploads only its SubVerso highlighting JSON, a few
  # megabytes, rather than the multi-gigabyte .lake tree that produced it.
  examples:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # The parts of the manifest entry that change the generated data: the
      # module list, the suppressed namespaces, the native dependencies and the
      # environment the extractor runs under.
      - id: config
        run: |
          jq -c --arg n '${{ matrix.project.name }}' 'map(select(.name == $n))' examples/examples.json \
            | sha256sum | cut -c1-16 | sed 's/^/hash=/' >> "$GITHUB_OUTPUT"

      # Exact keys only. Generated Lean data is not compatible across toolchains
      # or dependency revisions, so a restore-key fallback would serve JSON that
      # no longer matches the sources -- worse than a rebuild. The SubVerso
      # revision is pinned in the project's lake-manifest.json, which is hashed,
      # and examples/build-highlighted.sh fails if Lake rewrites that lockfile
      # while building, since the data would then be keyed on the wrong inputs.
      #
      # `runner.os` is only "Linux", so an ubuntu-latest image change does not
      # invalidate anything. That matters for sos alone, whose extractor runs
      # CSDP through an FFI while highlighting; bump the `v1` below by hand if a
      # native dependency ever starts changing what comes out.
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project.dir }}/.lake/build/highlighted
          key: highlighted-v1-${{ matrix.project.name }}-${{ runner.os }}-${{ hashFiles(format('{0}/lean-toolchain', matrix.project.dir), format('{0}/lake-manifest.json', matrix.project.dir), format('{0}/lakefile.*', matrix.project.dir), format('{0}/**/*.lean', matrix.project.dir), format('{0}/**/*.sh', matrix.project.dir), 'examples/build-highlighted.sh') }}-${{ steps.config.outputs.hash }}

      - name: Install elan
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Only what this project needs: CSDP's BLAS/LAPACK runtime for sos, GMP
      # for hex's Berlekamp-Zassenhaus, zlib for lean-zip's FFI shims.
      - name: Install native dependencies
        if: steps.cache.outputs.cache-hit != 'true' && join(matrix.project.aptPackages) != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ join(matrix.project.aptPackages, ' ') }}

      - name: Build highlighting data
        if: steps.cache.outputs.cache-hit != 'true'
        run: examples/build-highlighted.sh ${{ matrix.project.name }}

      - name: Check the highlighting data
        run: examples/check-highlighted.sh ${{ matrix.project.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: highlighted-${{ matrix.project.name }}
          path: ${{ matrix.project.dir }}/.lake/build/highlighted
          retention-days: 1
          if-no-files-found: error

      - if: always()
        run: |
          outcome=$([ '${{ steps.cache.outputs.cache-hit }}' = 'true' ] && echo 'cache hit' || echo 'built')
          elapsed=$(( $(date +%s) - STARTED_AT ))
          printf '**examples/%s**: %s, %dm%02ds\n\n' \
            '${{ matrix.project.name }}' "$outcome" $((elapsed / 60)) $((elapsed % 60)) >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # No native dependencies here: this job never builds an example project,
      # so it never needs CSDP's BLAS, GMP or zlib.
      - uses: actions/download-artifact@v4
        with:
          pattern: highlighted-*
          path: _highlighted

      # Put each project's JSON back exactly where `lake build +M:highlighted`
      # would have left it, which is where Verso looks.
      - name: Unpack the highlighting data
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name dir; do
            src="_highlighted/highlighted-$name"
            if [[ ! -d "$src" ]]; then
              echo "::error::no highlighting artifact was uploaded for $name"
              exit 1
            fi
            mkdir -p "$dir/.lake/build"
            rm -rf "$dir/.lake/build/highlighted"
            mv "$src" "$dir/.lake/build/highlighted"
          done < <(jq -r '.[] | "\(.name)\t\(.dir)"' examples/examples.json)

      - name: Check the highlighting data
        run: examples/check-highlighted.sh

      # SITE_PREBUILT_EXAMPLES makes Site/Examples.lean seed Verso's module
      # cache from that JSON, so elaborating the posts never shells out to Lake
      # in an example project. Missing or malformed data is an error, not a
      # fallback.
      - name: Build site
        env:
          SITE_PREBUILT_EXAMPLES: "1"
        run: |
          lake build
          .lake/build/bin/generate-site --output _site

      # If an anchor did reach Verso's Lake path anyway, the shell-out would
      # have resolved the project's dependencies and compiled its library. The
      # artifacts only ever create .lake/build/highlighted, so anything else
      # under .lake means the site job rebuilt an example project.
      - name: Confirm no example project was rebuilt
        run: |
          set -uo pipefail
          status=0
          # Every project under examples/, not just the manifest's, so a post
          # that reaches a project nobody registered is caught too.
          for lakefile in examples/*/lakefile.*; do
            dir=$(dirname "$lakefile")
            [[ -d "$dir/.lake" ]] || continue
            extra=$(find "$dir/.lake" -mindepth 1 -maxdepth 1 ! -name build)
            if [[ -d "$dir/.lake/build" ]]; then
              more=$(find "$dir/.lake/build" -mindepth 1 -maxdepth 1 ! -name highlighted)
              extra=$(printf '%s\n%s' "$extra" "$more")
            fi
            extra=$(sed '/^[[:space:]]*$/d' <<<"$extra")
            if [[ -n "$extra" ]]; then
              echo "::error::the site build fell back to building $dir; it created:"
              echo "$extra"
              status=1
            fi
          done
          exit $status

      # Check the generated site for broken links. `-verso-data` holds Verso's
      # framework assets, referenced relative to the per-page <base>; the
      # checker doesn't honour <base>, so exclude them. 429s are transient.
      #
      # This step guards against links *we* got wrong, so it must not block the
      # deploy over someone else's downtime. On 2026-07-26 lean-lang.org was
      # unreachable twice — once a timeout, once a refused connection — and each
      # time publishing stalled until the run was retried by hand, with nothing
      # wrong on our side. `--max-retries` does not help: it retries inside the
      # run, and the outage outlasted it.
      #
      # So lychee no longer decides the outcome (`fail: false`); the step after
      # it does, splitting its JSON report into faults we can fix (an HTTP
      # status, a missing local file, a bad fragment) and faults we cannot (the
      # remote is down or slow). The first still fails the build; the second is
      # a warning.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan only the blog's own pages. The imported grind paper under
          # _site/papers is a self-contained Verso build (its own relative
          # assets + <base> tag confuse a base-unaware checker); the landing's
          # link *to* /papers/grind/ is still validated from index.html.
          args: >-
            --root-dir "${{ github.workspace }}/_site"
            --exclude verso-data
            --accept '200..=299, 429'
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --no-progress
            ./_site/index.html ./_site/blog
          format: json
          output: lychee/out.json
          jobSummary: false
          fail: false

      - name: Fail only on links we can fix
        run: |
          python3 - <<'PYEOF'
          import json, sys
          rep = json.load(open("lychee/out.json"))
          hard, soft = [], []
          # A network-level failure carries no HTTP code and reports itself as
          # a network error; anything else in error_map is a real fault in our
          # markup (4xx/5xx, missing local file, bad fragment).
          for src, entries in (rep.get("error_map") or {}).items():
              for e in entries:
                  st = e.get("status") or {}
                  text = st.get("text", "")
                  remote_down = st.get("code") is None and (
                      text.startswith("Network error")
                      or "Connection" in text
                      or "timed out" in text.lower()
                      or "dns" in text.lower()
                  )
                  (soft if remote_down else hard).append((src, e.get("url"), text))
          # Timeouts get their own map, and are always someone else's problem.
          for src, entries in (rep.get("timeout_map") or {}).items():
              for e in entries:
                  soft.append((src, e.get("url"), "timed out"))
          for src, url, why in soft:
              print(f"::warning::unreachable, not failing the deploy: {url} (in {src}) - {why}")
          for src, url, why in hard:
              print(f"::error::broken link: {url} (in {src}) - {why}")
          print(f"{len(hard)} broken, {len(soft)} unreachable")
          sys.exit(1 if hard else 0)
          PYEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - if: always()
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          printf '**site build and link check**: %dm%02ds\n\n' \
            $((elapsed / 60)) $((elapsed % 60)) >> "$GITHUB_STEP_SUMMARY"
          printf 'Baseline, when every example was built in sequence inside this job: 41m48s total.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  # A `workflow_dispatch` run on a branch is how this workflow gets tested, and
  # a test run must not publish.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
