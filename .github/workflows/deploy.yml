name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # sos → csdp-ffi builds CSDP and links it against the system BLAS/LAPACK
      # runtime; the lp examples use the pure-Lean backend (no native deps).
      - name: Install native dependencies (for sos / CSDP)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblapack-dev libblas-dev gfortran

      # Pre-build the example subprojects under their own toolchains so the
      # blog's SubVerso extraction (which shells out to each) only reads
      # already-built artifacts.
      - name: Build lp examples
        working-directory: examples/lp
        run: lake build

      - name: Build sos examples (fetches Mathlib cache)
        working-directory: examples/sos
        run: |
          lake exe cache get
          lake build

      - name: Build site
        run: |
          lake build
          .lake/build/bin/generate-site --output _site

      # Check the generated site for broken links. `-verso-data` holds Verso's
      # framework assets, referenced relative to the per-page <base>; the
      # checker doesn't honour <base>, so exclude them. 429s are transient.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan only the blog's own pages. The imported grind paper under
          # _site/papers is a self-contained Verso build (its own relative
          # assets + <base> tag confuse a base-unaware checker); the landing's
          # link *to* /papers/grind/ is still validated from index.html.
          args: >-
            --root-dir "${{ github.workspace }}/_site"
            --exclude verso-data
            --accept '200..=299, 429'
            --max-retries 3
            --no-progress
            ./_site/index.html ./_site/blog
          fail: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
