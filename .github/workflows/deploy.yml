name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # sos → csdp-ffi builds CSDP and links it against the system BLAS/LAPACK
      # runtime; the lp examples use the pure-Lean backend (no native deps).
      - name: Install native dependencies (for sos / CSDP, hex / GMP, zip / zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblapack-dev libblas-dev gfortran libgmp-dev zlib1g-dev

      # Pre-build the example subprojects under their own toolchains so the
      # blog's SubVerso extraction (which shells out to each) only reads
      # already-built artifacts.
      - name: Build lp examples
        working-directory: examples/lp
        run: lake build

      - name: Build sos examples (fetches Mathlib cache)
        working-directory: examples/sos
        run: |
          lake exe cache get
          lake build

      # hex examples: the Core and Coppersmith sections are Mathlib-free (GMP
      # for Berlekamp-Zassenhaus, hence libgmp-dev), the Mathlib section imports
      # HexRowReduceMathlib. The script fetches the Mathlib cache, then builds.
      - name: Build hex examples (fetches Mathlib cache)
        working-directory: examples/hex
        run: ./build-examples.sh

      # zip examples: one anchor, but it is the DEFLATE roundtrip capstone, so
      # this compiles the whole of lean-zip's verification (~15 minutes, and
      # zlib for the library's FFI shims). There is no cache to fetch.
      #
      # ZLIB_LDFLAGS short-circuits lean-zip's zlib probe. Without it the probe
      # falls through to `xcrun` when pkg-config can't find zlib, which throws
      # on Linux and leaves Lake with a configuration it rejects on the *next*
      # invocation ("compiled configuration is invalid") — exactly what the
      # site build does when it shells back in to extract the anchor.
      - name: Build zip examples
        working-directory: examples/zip
        env:
          ZLIB_LDFLAGS: -lz
        run: lake build

      - name: Build site
        env:
          ZLIB_LDFLAGS: -lz
        run: |
          lake build
          .lake/build/bin/generate-site --output _site

      # Check the generated site for broken links. `-verso-data` holds Verso's
      # framework assets, referenced relative to the per-page <base>; the
      # checker doesn't honour <base>, so exclude them. 429s are transient.
      #
      # This step guards against links *we* got wrong, so it must not block the
      # deploy over someone else's downtime. On 2026-07-26 lean-lang.org was
      # unreachable twice — once a timeout, once a refused connection — and each
      # time publishing stalled until the run was retried by hand, with nothing
      # wrong on our side. `--max-retries` does not help: it retries inside the
      # run, and the outage outlasted it.
      #
      # So lychee no longer decides the outcome (`fail: false`); the step after
      # it does, splitting its JSON report into faults we can fix (an HTTP
      # status, a missing local file, a bad fragment) and faults we cannot (the
      # remote is down or slow). The first still fails the build; the second is
      # a warning.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan only the blog's own pages. The imported grind paper under
          # _site/papers is a self-contained Verso build (its own relative
          # assets + <base> tag confuse a base-unaware checker); the landing's
          # link *to* /papers/grind/ is still validated from index.html.
          args: >-
            --root-dir "${{ github.workspace }}/_site"
            --exclude verso-data
            --accept '200..=299, 429'
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --no-progress
            ./_site/index.html ./_site/blog
          format: json
          output: lychee/out.json
          jobSummary: false
          fail: false

      - name: Fail only on links we can fix
        run: |
          python3 - <<'PYEOF'
          import json, sys
          rep = json.load(open("lychee/out.json"))
          hard, soft = [], []
          # A network-level failure carries no HTTP code and reports itself as
          # a network error; anything else in error_map is a real fault in our
          # markup (4xx/5xx, missing local file, bad fragment).
          for src, entries in (rep.get("error_map") or {}).items():
              for e in entries:
                  st = e.get("status") or {}
                  text = st.get("text", "")
                  remote_down = st.get("code") is None and (
                      text.startswith("Network error")
                      or "Connection" in text
                      or "timed out" in text.lower()
                      or "dns" in text.lower()
                  )
                  (soft if remote_down else hard).append((src, e.get("url"), text))
          # Timeouts get their own map, and are always someone else's problem.
          for src, entries in (rep.get("timeout_map") or {}).items():
              for e in entries:
                  soft.append((src, e.get("url"), "timed out"))
          for src, url, why in soft:
              print(f"::warning::unreachable, not failing the deploy: {url} (in {src}) - {why}")
          for src, url, why in hard:
              print(f"::error::broken link: {url} (in {src}) - {why}")
          print(f"{len(hard)} broken, {len(soft)} unreachable")
          sys.exit(1 if hard else 0)
          PYEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
